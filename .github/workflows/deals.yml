name: Oppdater tilbud
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg deals.json
        env:
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
        run: python3 scripts/build_deals.py
      - name: Commit
        run: |
          git config user.name "tilbud-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet || git commit -m "Oppdater tilbud $(date -u +%F_%H%M)"
          git push
